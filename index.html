<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>沐晴网络科技</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#07070b;color:#e8e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
h1{font-size:28px;font-weight:800;margin-bottom:4px;background:linear-gradient(135deg,#6C5CE7,#00CEC9);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:rgba(255,255,255,0.35);font-size:14px;margin-bottom:32px}
.cards{display:grid;gap:16px;width:100%;max-width:400px}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:16px;padding:24px;text-decoration:none;color:inherit;transition:all .3s;display:block}
.card:hover{transform:translateY(-4px);border-color:rgba(108,92,231,0.2);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.card h2{font-size:18px;font-weight:700;margin-bottom:4px}
.card p{font-size:13px;color:rgba(255,255,255,0.4);line-height:1.6}
.card .tag{display:inline-block;font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;margin-bottom:10px}
.tag-light{background:rgba(0,102,204,0.1);color:#0066cc;border:1px solid rgba(0,102,204,0.15)}
.tag-dark{background:rgba(108,92,231,0.1);color:#6C5CE7;border:1px solid rgba(108,92,231,0.15)}
.footer{margin-top:24px;font-size:11px;color:rgba(255,255,255,0.15)}
</style>
</head>
<body>
<h1>沐晴网络科技</h1>
<p class="sub">私人订制移动应用开发</p>
<div class="cards">
  <a href="apple.html" class="card">
    <span class="tag tag-light">推荐</span>
    <h2>苹果风格</h2>
    <p>白底清爽 · 卡片点击展开详情 · 弹簧物理反馈 · 适合大众分享</p>
  </a>
  <a href="dark.html" class="card">
    <span class="tag tag-dark">技术</span>
    <h2>暗夜科技</h2>
    <p>深色粒子背景 · 动效炫酷 · 科技感强 · 适合展示技术实力</p>
  </a>
</div>
<div class="footer">沐晴网络科技 · 用心做好每一个 App</div>
</body>
</html>
